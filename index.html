<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>For Nnay 💖</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SCENE 1 : FIREWORK HITAM PUTIH -->
<section id="scene-firework" class="scene active">
  <div class="firework-container"></div>
</section>

<!-- SCENE 2 : PAINTBALL LOVE -->
<section id="scene-paintball" class="scene">
  <div class="paintball-container">
    <div class="love-shape">
      <span class="love-text">Nayla</span>
    </div>
  </div>
</section>

<!-- SCENE 3 : CARRIAGE -->
<section id="scene-carriage" class="scene">
  <img src="assets/img/carriage.png" class="carriage">
  <button id="nextScene">Lanjut</button>
</section>

<!-- SCENE 4 : CINDERELLA -->
<section id="scene-cinderella" class="scene">
  <img src="assets/img/cinderella.png" class="cinderella">
  <div class="card">
    <h2>Untuk Kamu</h2>
    <p>
      Tidak perlu kata panjang.<br>
      Aku cuma mau kamu tahu, aku serius.
    </p>

    <div class="frames">
      <img src="assets/img/frame1.jpg">
      <img src="assets/img/frame2.jpg">
      <img src="assets/img/frame3.jpg">
    </div>
  </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
