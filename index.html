<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>For Nayla 💖</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SCENE 1 : FIREWORK -->
<section class="scene active" id="scene-firework">
  <div class="firework-container"></div>
</section>

<!-- SCENE 2 : PAINTBALL LOVE -->
<section class="scene" id="scene-paintball">
  <div class="paintball-container">
    <div class="love-text">Nayla</div>
  </div>
</section>

<!-- SCENE 3 : CARRIAGE -->
<section class="scene" id="scene-carriage">
  <svg class="carriage-svg" width="320" height="160" viewBox="0 0 320 160">
    <g class="wheel" transform="translate(70 120)">
      <circle r="22" fill="#333"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#aaa"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#aaa"/>
    </g>
    <g class="wheel" transform="translate(230 120)">
      <circle r="18" fill="#333"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#aaa"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#aaa"/>
    </g>
    <rect x="90" y="40" width="130" height="60" rx="20" fill="#ffb6c1"/>
    <rect x="110" y="20" width="90" height="40" rx="20" fill="#ffd1dc"/>
  </svg>
</section>

<!-- SCENE 4 : CINDERELLA -->
<section class="scene" id="scene-cinderella">
  <img src="assets/img/cinderella.png" class="cinderella">
  <div class="card">
    <h2>Hai Pacar Kandung</h2>
    <p>Kangen kamu. Jangan ilang ya.</p>
  </div>
</section>

<script src="js/script.js"></script>
</body>
</html>
